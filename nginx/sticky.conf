# Sticky (open Source): hash consistente em cookie
# Sem cookie "lbid", o nginx cria um (id aleatório) e o hash fixa o cliente num servidor.
# No NGINX Plus existe a diretiva nativa: sticky cookie srv_id expires=1h;

events {}


http {
    map $cookie_lbid $sticky_key {
        ""      $request_id;
        default $cookie_lbid;
    }

    # só envia Set-Cookie quando o cliente ainda não tem o cookie
    map $cookie_lbid $set_lbid {
        ""      "lbid=$request_id; Path=/; Max-Age=3600; HttpOnly";
        default "";
    }

    upstream app {
        hash $sticky_key consistent;
        server host.docker.internal:3001;
        server host.docker.internal:3002;
        server host.docker.internal:3003;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Set-Cookie $set_lbid;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
