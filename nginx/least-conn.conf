# Least Connections

event {}

http {
    upstream app {
        least_conn;
        server host.docker.internal:3001
        server host.docker.internal:3002
        server host.docker.internal:3003
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP
            $remote_addr;
            add_header X-upstream $upstream_addr
            always;
        }
    }
}